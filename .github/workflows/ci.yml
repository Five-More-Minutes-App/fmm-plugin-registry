name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-checks every pinned commit against its repository each week, in case a repository was
    # rewritten or deleted after being listed.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Every listing matches its repository at the pinned commit
        run: npm run verify
      - run: npm run build

  images:
    # The image the Home Hub runs for each plugin that needs it, built from the reviewed commit (ADR 9 in fmm-app). On a pull
    # request it is only built, so a Dockerfile that does not build is caught before it is listed; on main it is pushed to
    # ghcr.io/five-more-minutes-app/plugins/<id>, once per commit. This job holds the one write permission, to packages, and
    # nothing else.
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the Home Hub images
        run: node scripts/build-images.mjs --out images.json ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && '--push' || '' }}
      - name: Build the catalogue with them
        run: npm run build -- --images images.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publish:
    # The catalog and the icons are published as a static site: what the marketplace and the portal read.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
