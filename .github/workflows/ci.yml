name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-checks every pinned commit against its repository each week, in case a repository was
    # rewritten or deleted after being listed.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Every listing matches its repository at the pinned commit
        run: npm run verify
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    # The catalog and the icons are published as a static site: what the marketplace and the portal read.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
